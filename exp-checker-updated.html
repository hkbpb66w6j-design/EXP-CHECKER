<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:620px;margin:0 auto;padding:24px 16px 42px}.title{text-align:center}.title h1{margin:0;font-size:32px}.title p{margin:7px 0 0;color:#697386}
.card,.admin{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:20px;margin-top:18px}.label{font-weight:700;margin-bottom:9px;display:block}
select,input,button{width:100%;min-height:52px;border-radius:12px;border:1px solid #d8dee8;padding:0 14px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:10px}.sub{font-size:12px;color:#697386;margin-bottom:6px}
.rule{font-weight:700;font-size:18px;margin:10px 0 0}.selected{text-align:center;font-weight:700;margin-top:15px}
button{margin-top:18px;background:#173b70;color:#fff;border:0;font-weight:800;cursor:pointer}
.result{text-align:center;margin-top:18px;padding:25px 18px;border-radius:18px;border:1px solid #dce3ec;background:#fff}
.icon{font-size:48px}.status{font-size:27px;font-weight:900;margin-top:8px}.detail{margin-top:9px;font-size:16px;line-height:1.6}
.today{text-align:center;color:#697386;font-size:12px;margin-top:16px}.admin{display:none}.admin.open{display:block}
.admin h2{margin:0 0 5px}.muted{font-size:12px;color:#697386}.rule-row{display:grid;grid-template-columns:1fr 105px;gap:10px;align-items:center;margin-top:13px}.rule-row label{font-weight:700}.save{background:#2f6f3e}.danger{background:#fff;color:#b42318;border:1px solid #e1a8a4}
.gear{background:#fff;color:#172033;border:1px solid #d8dee8;margin-top:14px}
@media(max-width:420px){.grid{gap:7px}.title h1{font-size:28px}.rule-row{grid-template-columns:1fr 95px}}
</style>
</head>
<body>
<main class="app">
  <div class="title">
    <h1>📦 EXP Checker</h1>
    <p>ตรวจสอบวันหมดอายุและเกณฑ์การลดราคา</p>
  </div>

  <section class="card">
    <label class="label" for="group">ประเภทสินค้า</label>
    <select id="group">
      <option value="home">Home use</option>
      <option value="dry">เบเกอรี่แห้ง</option>
      <option value="fresh">เบเกอรี่สด</option>
    </select>
    <p id="rule" class="rule"></p>

    <div class="label" style="margin-top:22px">วันหมดอายุ (EXP)</div>
    <div class="grid">
      <div><div class="sub">Day</div><select id="day"></select></div>
      <div><div class="sub">Month</div><select id="month"></select></div>
      <div><div class="sub">Year</div><select id="year"></select></div>
    </div>
    <div id="selected" class="selected"></div>
  </section>

  <button id="check">ตรวจสอบวันหมดอายุ</button>
  <section id="result" class="result" hidden></section>
  <div id="today" class="today"></div>

  <button id="adminBtn" class="gear" type="button">⚙️ ตั้งค่าเกณฑ์ (Admin)</button>

  <section id="admin" class="admin">
    <h2>⚙️ ตั้งค่าเกณฑ์</h2>
    <div class="muted">กำหนดจำนวนวันสูงสุดที่สามารถนำสินค้าไปลดราคาได้</div>

    <div class="rule-row">
      <label>Home use</label><input id="homeLimit" type="number" min="0" step="1">
    </div>
    <div class="rule-row">
      <label>เบเกอรี่แห้ง</label><input id="dryLimit" type="number" min="0" step="1">
    </div>
    <div class="rule-row">
      <label>เบเกอรี่สด</label><input id="freshLimit" type="number" min="0" step="1">
    </div>
    <div class="rule-row">
      <label>นำออกก่อน EXP (วัน)</label><input id="removeLimit" type="number" min="0" step="1" value="1">
    </div>

    <button id="save" class="save" type="button">บันทึกเกณฑ์</button>
    <button id="reset" class="danger" type="button">คืนค่าเริ่มต้น</button>
    <div class="muted" style="margin-top:10px">
      หมายเหตุ: เวอร์ชันนี้เก็บค่าที่แก้ไขไว้ในเบราว์เซอร์ของเครื่อง Admin เครื่องนั้น
      ยังไม่ใช่การเปลี่ยนเกณฑ์ส่วนกลางของพนักงานทุกคน
    </div>
  </section>
</main>

<script>
(() => {
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const defaults={home:{name:"Home use",limit:30},dry:{name:"เบเกอรี่แห้ง",limit:15},fresh:{name:"เบเกอรี่สด",limit:1},removeBefore:1};
  const $=id=>document.getElementById(id);
  const now=new Date(), pad=n=>String(n).padStart(2,"0");
  const todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  let rules=loadRules();

  function loadRules(){
    try{
      const saved=JSON.parse(localStorage.getItem("expCheckerRules")||"null");
      if(saved && saved.home && saved.dry && saved.fresh) return saved;
    }catch(e){}
    return JSON.parse(JSON.stringify(defaults));
  }
  function saveRules(){
    localStorage.setItem("expCheckerRules",JSON.stringify(rules));
  }
  function fillAdmin(){
    $("homeLimit").value=rules.home.limit;
    $("dryLimit").value=rules.dry.limit;
    $("freshLimit").value=rules.fresh.limit;
    $("removeLimit").value=rules.removeBefore ?? 1;
  }

  for(let i=1;i<=31;i++) $("day").add(new Option(i,i));
  months.forEach((m,i)=>$("month").add(new Option(m,i+1)));
  for(let y=now.getFullYear()-1;y<=now.getFullYear()+15;y++) $("year").add(new Option(y,y));
  $("day").value=now.getDate(); $("month").value=now.getMonth()+1; $("year").value=now.getFullYear();
  $("today").textContent=`Today: ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

  function validDay(){
    const max=new Date(Number($("year").value),Number($("month").value),0).getDate();
    [...$("day").options].forEach(o=>o.disabled=Number(o.value)>max);
    if(Number($("day").value)>max) $("day").value=max;
  }
  function update(){
    validDay();
    const r=rules[$("group").value];
    $("rule").textContent=`ลดราคาได้เมื่อเหลืออายุ ≤ ${r.limit} วัน`;
    $("selected").textContent=`EXP: ${months[Number($("month").value)-1]} ${$("day").value}, ${$("year").value}`;
  }
  [$("day"),$("month"),$("year"),$("group")].forEach(el=>el.addEventListener("change",update));
  update(); fillAdmin();

  $("check").addEventListener("click",()=>{
    update();
    const y=Number($("year").value),m=Number($("month").value),d=Number($("day").value);
    const diff=Math.round((Date.UTC(y,m-1,d)-todayUTC)/86400000);
    const r=rules[$("group").value];
    let icon,title,detail;
    if(diff<0){icon="🔴";title="หมดอายุแล้ว";detail=`หมดอายุมาแล้ว ${Math.abs(diff)} วัน`;}
    else if(diff<=rules.removeBefore){icon="🔴";title=diff===0?"หมดอายุวันนี้":"ต้องนำสินค้าออกช่วงเย็นวันนี้";detail=diff===0?"ห้ามจำหน่าย / ต้องนำออกแล้ว":`วันนี้ต้องนำสินค้าออกช่วงเย็น เพราะเหลือ ${diff} วันก่อน EXP`;}
    else if(diff<=r.limit){icon="🟠";title="สามารถลดราคาได้";detail=`เหลืออายุ ${diff} วัน — อยู่ในเกณฑ์ ${r.name}`;}
    else{icon="🟢";title="ยังลดราคาไม่ได้";detail=`เหลืออายุ ${diff} วัน — ต้องเหลือ ≤ ${r.limit} วัน`;}
    $("result").hidden=false;
    $("result").innerHTML=`<div class="icon">${icon}</div><div class="status">${title}</div><div class="detail">EXP: <strong>${months[m-1]} ${d}, ${y}</strong><br>${detail}<br><small>เกณฑ์ ${r.name}: ลดได้เมื่อเหลือ ≤ ${r.limit} วัน</small></div>`;
  });

  $("adminBtn").addEventListener("click",()=>{
    $("admin").classList.toggle("open");
    fillAdmin();
  });
  $("save").addEventListener("click",()=>{
    rules.home.limit=Math.max(0,Number($("homeLimit").value)||0);
    rules.dry.limit=Math.max(0,Number($("dryLimit").value)||0);
    rules.fresh.limit=Math.max(0,Number($("freshLimit").value)||0);
    rules.removeBefore=Math.max(0,Number($("removeLimit").value)||0);
    saveRules(); update();
    alert("บันทึกเกณฑ์เรียบร้อยแล้ว");
  });
  $("reset").addEventListener("click",()=>{
    rules=JSON.parse(JSON.stringify(defaults));
    saveRules(); fillAdmin(); update();
    alert("คืนค่าเริ่มต้นแล้ว");
  });
})();
</script>
</body>
</html>
