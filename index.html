<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Guide</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.app{max-width:620px;margin:auto;padding:25px 16px 42px}.title{text-align:center}.title h1{margin:0;font-size:32px}.title p{margin:7px 0 0;color:#697386}.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:20px;margin-top:18px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{padding:18px 12px;border:2px solid #dfe5ee;border-radius:16px;background:#fff;text-align:center;font-size:16px;font-weight:800;cursor:pointer;color:#172033}.mode.active{border-color:#173b70;background:#eef4ff}label{font-weight:700;display:block;margin-bottom:8px}select,input,button{width:100%;min-height:52px;border-radius:12px;border:1px solid #d8dee8;padding:0 14px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1.7fr 1.2fr;gap:10px}.sub{font-size:12px;color:#697386;margin-bottom:6px}.selected{text-align:center;font-weight:800;margin-top:15px}.rule{font-size:16px;font-weight:800;margin:8px 0 0}.doc-row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.doc-btn{margin-top:0;background:#fff;color:#173b70;border:1px solid #b9c9e3;font-weight:800}.primary{margin-top:18px;background:#173b70;color:#fff;border:0;font-weight:900}.result{margin-top:18px;padding:25px 18px;border-radius:18px;border:2px solid #dce3ec;background:#fff;text-align:center}.result.green{border-color:#42a866;background:#effaf2}.result.yellow{border-color:#d9a51d;background:#fff9df}.result.red{border-color:#dc4b4b;background:#fff1f1}.icon{font-size:48px}.status{font-size:27px;font-weight:900;margin-top:8px}.result.green .status{color:#18743a}.result.yellow .status{color:#9a6b00}.result.red .status{color:#b42318}.detail{margin-top:10px;font-size:16px;line-height:1.65}.today{text-align:center;color:#697386;font-size:12px;margin-top:16px}.admin.open{display:block}.admin h2{margin:0 0 5px}.muted{font-size:12px;color:#697386}.rule-row{display:grid;grid-template-columns:1fr 105px;gap:10px;align-items:center;margin-top:13px}.hidden{display:none}@media(max-width:420px){.grid{gap:7px}.title h1{font-size:28px}.mode-grid{gap:8px}.status{font-size:24px}}

.fresh-note{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff8df;border:1px solid #f0d98a;color:#5b4a12;font-size:13px;line-height:1.55}
.fresh-note strong{display:block;margin-bottom:3px}

:root{
  --green:#16794a;
  --green-dark:#0f5c38;
  --green-soft:#edf8f1;
  --green-border:#bfe3cc;
  --yellow:#a66b00;
  --yellow-soft:#fff8df;
  --red:#b42318;
  --red-soft:#fff0ee;
}
body{background:#f6faf7!important;color:#17251d!important}
.app{max-width:520px!important}
.title h1{color:var(--green-dark)!important}
.title p{color:#5d6c63!important}
.card,.result{border-color:#dbe9df!important;box-shadow:0 4px 18px rgba(22,121,74,.06)!important}
button{background:var(--green)!important}
button:hover{background:var(--green-dark)!important}
.mode{background:#fff!important;color:#345043!important;border:1px solid #d6e5da!important}
.mode.active{background:var(--green-soft)!important;color:var(--green-dark)!important;border-color:var(--green)!important}
.primary{background:var(--green)!important}
.doc-btn{background:#fff!important;color:var(--green-dark)!important;border:1px solid var(--green-border)!important}
.note{background:#f3f8f4!important;border-color:#d7e9dd!important}
.fresh-note{background:var(--yellow-soft)!important;border-color:#efd78d!important;color:#5b4a12!important}
.green{background:var(--green-soft)!important;border-color:var(--green-border)!important;color:var(--green-dark)!important}
.yellow{background:var(--yellow-soft)!important;border-color:#efd78d!important;color:#725000!important}
.red{background:var(--red-soft)!important;border-color:#efc2bd!important;color:var(--red)!important}


select{color:#17251d!important;color-scheme:light}
select:disabled{opacity:1}
.discount-icon{
  width:80px;
  height:80px;
  object-fit:contain;
  display:block;
  margin:0 auto 6px;
}
.expire-icon{
  font-size:75px;
  line-height:1;
  display:block;
  margin-bottom:6px;
}
</style>
</head>
<body>
<main class="app">
<div class="title"><h1>Audit Guide</h1><p>ระบบช่วยตรวจสอบวันหมดอายุและเงื่อนไขการลดราคา 20%</p></div>

<section class="card">
<label>เลือกประเภทการตรวจสอบ</label>
<div class="mode-grid">
<button id="modeExpire" class="mode active" type="button"><span class="expire-icon">🔍</span><br>วันหมดอายุ</button>
<button id="modeDiscount" class="mode" type="button"><img src="discount-20-transparent.PNG" class="discount-icon" alt="20%"><br>ตรวจสอบเงื่อนไขการ<br>ลดราคา 20%</button>
</div>
</section>

<section id="productCard" class="card hidden">
<label for="group">ประเภทสินค้า</label>
<select id="group">
<option value="home">Home use</option>
<option value="dry">เบเกอรี่แห้ง</option>
<option value="fresh">เบเกอรี่สด</option>
</select>
<div id="rule" class="rule"></div>
<div class="doc-row"><button id="docBtn" class="doc-btn" type="button">📄 อ่านเงื่อนไขฉบับเต็ม</button></div>
</section>

<section class="card">
<label>วันหมดอายุ (EXP)</label>
<div class="grid">
<div><div class="sub">Day</div><select id="day"></select></div>
<div><div class="sub">Month</div><select id="month"></select></div>
<div><div class="sub">Year</div><select id="year"></select></div>
</div>
<div id="selected" class="selected"></div>
</section>

<button id="check" class="primary">ตรวจสอบผล</button>
<section id="result" class="result" hidden></section>
<div id="today" class="today"></div>
</main>

<script>
(()=> {
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
const defaults={home:{name:"Home use",limit:30},dry:{name:"เบเกอรี่แห้ง",limit:15},fresh:{name:"เบเกอรี่สด",limit:2},removeBefore:1};
const docs={home:"home-use-conditions.pdf",dry:"bakery-dry-conditions.pdf",fresh:"bakery-dry-conditions.pdf"};
const $=id=>document.getElementById(id), now=new Date(), pad=n=>String(n).padStart(2,"0");
const todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
let rules=load();
function load(){try{const x=JSON.parse(localStorage.getItem("expCheckerRules")||"null");if(x&&x.home&&x.dry&&x.fresh)return {...defaults,...x}}catch(e){}return JSON.parse(JSON.stringify(defaults))}
function validDay(){const max=new Date(Number($("year").value),Number($("month").value),0).getDate();[...$("day").options].forEach(o=>o.disabled=Number(o.value)>max);if(Number($("day").value)>max)$("day").value=max}
function update(){
 validDay();
 $("selected").textContent=`EXP: ${months[Number($("month").value)-1]} ${$("day").value} (${pad(Number($("month").value))}) , ${$("year").value}`;
 const r=rules[$("group").value];
 $("rule").textContent=`เกณฑ์: ลดราคาได้ใน ${r.limit} วันสุดท้ายก่อน/ถึง EXP`;
}
$("day").innerHTML=Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join("");
$("month").innerHTML=months.map((m,i)=>`<option value="${i+1}">${m} (${pad(i+1)})</option>`).join("");
$("year").innerHTML=Array.from({length:17},(_,i)=>{const y=now.getFullYear()-1+i;return `<option value="${y}">${y}</option>`}).join("");
$("day").value=String(now.getDate());
$("month").value=String(now.getMonth()+1);
$("year").value=String(now.getFullYear());
if(!$("day").value)$("day").selectedIndex=0;
if(!$("month").value)$("month").selectedIndex=0;
if(!$("year").value)$("year").selectedIndex=0;
$("today").textContent=`Today: ${months[now.getMonth()]} (${pad(now.getMonth()+1)}) ${now.getDate()}, ${now.getFullYear()}`;
function setMode(discount){$("modeDiscount").classList.toggle("active",discount);$("modeExpire").classList.toggle("active",!discount);$("productCard").classList.toggle("hidden",!discount);$("result").hidden=true}
$("modeExpire").onclick=()=>setMode(false);$("modeDiscount").onclick=()=>setMode(true);
[$("day"),$("month"),$("year"),$("group")].forEach(x=>x.addEventListener("change",update));update();
$("docBtn").onclick=()=>{window.open("./"+encodeURIComponent(docs[$("group").value]),"_blank")};
$("check").onclick=()=>{
 update();
 const y=+$("year").value,m=+$("month").value,d=+$("day").value,diff=Math.round((Date.UTC(y,m-1,d)-todayUTC)/86400000);
 let icon,title,detail,cls;
 const expDate=new Date(Date.UTC(y,m-1,d));
 const removeDate=new Date(expDate.getTime()-Number(rules.removeBefore)*86400000);
 const removeText=`วันนำออก: ${months[removeDate.getUTCMonth()]} (${pad(removeDate.getUTCMonth()+1)}) ${removeDate.getUTCDate()}, ${removeDate.getUTCFullYear()} ก่อนปิดร้าน`;
 if(!$("modeDiscount").classList.contains("active")){
   if(diff<0){icon="🔴";title="หมดอายุแล้ว";detail=`หมดอายุมาแล้ว ${Math.abs(diff)} วัน`;cls="red";}
   else if(diff===0){icon="🔴";title="หมดอายุวันนี้";detail="ไม่สามารถจำหน่ายได้ / ต้องนำออก";cls="red";}
   else if(diff===1){icon="🟡";title="ยังไม่หมดอายุ";detail="เหลืออายุ 1 วัน<br><strong>⚠️ ต้องนำสินค้าออกก่อนปิดร้านวันนี้</strong>";cls="yellow";}
   else{icon="🟢";title="ยังไม่หมดอายุ";detail=`เหลืออายุ ${diff} วัน`;cls="green";}
 }else{
   const r=rules[$("group").value], start=Math.max(1,Number(r.limit)-1), remove=Number(rules.removeBefore);
   if(diff<=0){icon="🔴";title=diff===0?"หมดอายุวันนี้":"หมดอายุแล้ว";detail=diff===0?"ห้ามจำหน่าย / ต้องนำออกแล้ว":`หมดอายุมาแล้ว ${Math.abs(diff)} วัน`;cls="red";}
   else if(diff<=start){icon="🟢";title="สามารถลดราคา 20% ได้";detail=diff===remove?`${removeText} — วันนี้ยังลดราคาได้`: `เหลือ ${diff} วันก่อน EXP — อยู่ในช่วงลดราคา ${r.limit} วันสุดท้าย (รวมวัน EXP)` + `<br>${removeText}`;cls="green";}
   else{icon="🟡";title="ยังไม่ถึงวันที่ลดราคา";detail=`เหลือ ${diff} วันก่อน EXP — จะเริ่มลดเมื่อเหลือ ${start} วันก่อน EXP`;cls="yellow";}
 }
 $("result").hidden=false;$("result").className=`result ${cls}`;$("result").innerHTML=`<div class="icon">${icon}</div><div class="status">${title}</div><div class="detail">EXP: <strong>${months[m-1]} (${pad(m)}) ${d}, ${y}</strong><br>${detail}</div>`;
};
})();
</script>
</body>
</html>
