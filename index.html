<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:620px;margin:0 auto;padding:28px 18px 40px}.title{text-align:center}.title h1{margin:0;font-size:32px}.title p{margin:7px 0 0;color:#697386}
.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:20px;margin-top:18px}.label{font-weight:700;margin-bottom:9px;display:block}
select,button{width:100%;min-height:52px;border-radius:12px;border:1px solid #d8dee8;padding:0 14px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:10px}.sub{font-size:12px;color:#697386;margin-bottom:6px}
.rule{font-weight:700;font-size:18px}.selected{text-align:center;font-weight:700;margin-top:15px}
button{margin-top:18px;background:#173b70;color:#fff;border:0;font-weight:800;cursor:pointer}
.result{text-align:center;margin-top:18px;padding:25px 18px;border-radius:18px;border:1px solid #dce3ec;background:#fff}
.icon{font-size:48px}.status{font-size:27px;font-weight:900;margin-top:8px}.detail{margin-top:9px;font-size:16px;line-height:1.6}
.today{text-align:center;color:#697386;font-size:12px;margin-top:16px}
@media(max-width:420px){.app{padding:22px 13px}.grid{gap:7px}.title h1{font-size:28px}}
</style>
</head>
<body>
<main class="app">
  <div class="title">
    <h1>📦 EXP Checker</h1>
    <p>ตรวจสอบวันหมดอายุและเกณฑ์การลดราคา</p>
  </div>

  <section class="card">
    <label class="label" for="group">ประเภทสินค้า</label>
    <select id="group">
      <option value="home">Home use</option>
      <option value="dry">เบเกอรี่แห้ง</option>
      <option value="fresh">เบเกอรี่สด</option>
    </select>
    <p id="rule" class="rule"></p>

    <div class="label" style="margin-top:22px">วันหมดอายุ (EXP)</div>
    <div class="grid">
      <div><div class="sub">Day</div><select id="day"></select></div>
      <div><div class="sub">Month</div><select id="month"></select></div>
      <div><div class="sub">Year</div><select id="year"></select></div>
    </div>
    <div id="selected" class="selected"></div>
  </section>

  <button id="check">ตรวจสอบวันหมดอายุ</button>
  <section id="result" class="result" hidden></section>
  <div id="today" class="today"></div>
</main>

<script>
(() => {
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const rules={
    home:{name:"Home use",limit:30},
    dry:{name:"เบเกอรี่แห้ง",limit:15},
    fresh:{name:"เบเกอรี่สด",limit:1}
  };
  const $=id=>document.getElementById(id);
  const now=new Date(), pad=n=>String(n).padStart(2,"0");
  const todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());

  for(let i=1;i<=31;i++) $("day").add(new Option(i,i));
  months.forEach((m,i)=>$("month").add(new Option(m,i+1)));
  for(let y=now.getFullYear()-1;y<=now.getFullYear()+15;y++) $("year").add(new Option(y,y));

  $("day").value=now.getDate();
  $("month").value=now.getMonth()+1;
  $("year").value=now.getFullYear();
  $("today").textContent=`Today: ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

  function validDay(){
    const max=new Date(Number($("year").value),Number($("month").value),0).getDate();
    [...$("day").options].forEach(o=>o.disabled=Number(o.value)>max);
    if(Number($("day").value)>max) $("day").value=max;
  }
  function update(){
    validDay();
    const r=rules[$("group").value];
    $("rule").textContent=`ลดราคาได้เมื่อเหลืออายุ ≤ ${r.limit} วัน`;
    $("selected").textContent=`EXP: ${months[Number($("month").value)-1]} ${$("day").value}, ${$("year").value}`;
  }
  [$("day"),$("month"),$("year"),$("group")].forEach(el=>el.addEventListener("change",update));
  update();

  $("check").addEventListener("click",()=>{
    update();
    const y=Number($("year").value),m=Number($("month").value),d=Number($("day").value);
    const diff=Math.round((Date.UTC(y,m-1,d)-todayUTC)/86400000);
    const r=rules[$("group").value];
    let icon,title,detail;
    if(diff<0){
      icon="🔴"; title="หมดอายุแล้ว"; detail=`หมดอายุมาแล้ว ${Math.abs(diff)} วัน`;
    }else if(diff===0){
      icon="🔴"; title="หมดอายุวันนี้"; detail="ไม่สามารถลดราคาได้";
    }else if(diff<=r.limit){
      icon="🟠"; title="สามารถลดราคาได้"; detail=`เหลืออายุ ${diff} วัน — อยู่ในเกณฑ์ ${r.name}`;
    }else{
      icon="🟢"; title="ยังลดราคาไม่ได้"; detail=`เหลืออายุ ${diff} วัน — ต้องเหลือ ≤ ${r.limit} วัน`;
    }
    $("result").hidden=false;
    $("result").innerHTML=`<div class="icon">${icon}</div><div class="status">${title}</div><div class="detail">EXP: <strong>${months[m-1]} ${d}, ${y}</strong><br>${detail}<br><small>เกณฑ์ ${r.name}: ลดได้เมื่อเหลือ ≤ ${r.limit} วัน</small></div>`;
  });
})();
</script>
</body>
</html>
