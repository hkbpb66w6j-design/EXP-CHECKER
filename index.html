<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXP Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}.app{max-width:620px;margin:auto;padding:25px 16px 42px}.title{text-align:center}.title h1{margin:0;font-size:32px}.title p{margin:7px 0 0;color:#697386}.card{background:#fff;border:1px solid #e2e7ef;border-radius:18px;padding:20px;margin-top:18px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{padding:18px 12px;border:2px solid #dfe5ee;border-radius:16px;background:#fff;text-align:center;font-size:16px;font-weight:800;cursor:pointer;color:#172033}.mode.active{border-color:#173b70;background:#eef4ff}label{font-weight:700;display:block;margin-bottom:8px}select,input,button{width:100%;min-height:52px;border-radius:12px;border:1px solid #d8dee8;padding:0 14px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1.7fr 1.2fr;gap:10px}.sub{font-size:12px;color:#697386;margin-bottom:6px}.selected{text-align:center;font-weight:800;margin-top:15px}.rule{font-size:16px;font-weight:800;margin:8px 0 0}.doc-row{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.doc-btn{margin-top:0;background:#fff;color:#173b70;border:1px solid #b9c9e3;font-weight:800}.primary{margin-top:18px;background:#173b70;color:#fff;border:0;font-weight:900}.result{margin-top:18px;padding:25px 18px;border-radius:18px;border:2px solid #dce3ec;background:#fff;text-align:center}.result.green{border-color:#42a866;background:#effaf2}.result.yellow{border-color:#d9a51d;background:#fff9df}.result.red{border-color:#dc4b4b;background:#fff1f1}.icon{font-size:48px}.status{font-size:27px;font-weight:900;margin-top:8px}.result.green .status{color:#18743a}.result.yellow .status{color:#9a6b00}.result.red .status{color:#b42318}.detail{margin-top:10px;font-size:16px;line-height:1.65}.today{text-align:center;color:#697386;font-size:12px;margin-top:16px}.admin{display:none}.admin.open{display:block}.admin h2{margin:0 0 5px}.muted{font-size:12px;color:#697386}.rule-row{display:grid;grid-template-columns:1fr 105px;gap:10px;align-items:center;margin-top:13px}.save{background:#2f6f3e;color:#fff}.danger{background:#fff;color:#b42318;border:1px solid #e1a8a4}.gear{background:#fff;color:#172033;border:1px solid #d8dee8}.hidden{display:none}.note{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f5f7fb;font-size:13px;line-height:1.55;color:#4b5565}@media(max-width:420px){.grid{gap:7px}.title h1{font-size:28px}.mode-grid{gap:8px}.status{font-size:24px}}
</style>
</head>
<body>
<main class="app">
<div class="title"><h1>📦 EXP Checker</h1><p>ตรวจสอบวันหมดอายุและเกณฑ์การลดราคา</p></div>

<section class="card">
<label>เลือกประเภทการตรวจสอบ</label>
<div class="mode-grid">
<button id="modeExpire" class="mode active" type="button">🔍<br>เช็กวันหมดอายุ</button>
<button id="modeDiscount" class="mode" type="button">💰<br>เช็กเงื่อนไขลดราคา 20%</button>
</div>
</section>

<section id="productCard" class="card hidden">
<label for="group">ประเภทสินค้า</label>
<select id="group">
<option value="home">Home use</option>
<option value="dry">เบเกอรี่แห้ง</option>
<option value="fresh">เบเกอรี่สด</option>
</select>
<div id="rule" class="rule"></div>
<div class="doc-row"><button id="docBtn" class="doc-btn" type="button">📄 อ่านเงื่อนไขฉบับเต็ม</button></div>
<div id="ruleNote" class="note"></div>
</section>

<section class="card">
<label>วันหมดอายุ (EXP)</label>
<div class="grid">
<div><div class="sub">Day</div><select id="day"></select></div>
<div><div class="sub">Month</div><select id="month"></select></div>
<div><div class="sub">Year</div><select id="year"></select></div>
</div>
<div id="selected" class="selected"></div>
</section>

<button id="check" class="primary">ตรวจสอบ</button>
<section id="result" class="result" hidden></section>
<div id="today" class="today"></div>

<button id="adminBtn" class="gear" type="button">⚙️ ตั้งค่าเกณฑ์ (Admin)</button>
<section id="admin" class="card admin">
<h2>⚙️ ตั้งค่าเกณฑ์</h2>
<div class="muted">ตั้งจำนวนวันเริ่มลดราคา และวันนำออกก่อน EXP</div>
<div class="rule-row"><label>Home use — วันลดราคา</label><input id="homeLimit" type="number" min="0" step="1"></div>
<div class="rule-row"><label>เบเกอรี่แห้ง — วันลดราคา</label><input id="dryLimit" type="number" min="0" step="1"></div>
<div class="rule-row"><label>เบเกอรี่สด — วันลดราคา</label><input id="freshLimit" type="number" min="0" step="1"></div>
<div class="rule-row"><label>นำออกก่อน EXP (วัน)</label><input id="removeLimit" type="number" min="0" step="1"></div>
<button id="save" class="save" type="button">บันทึกเกณฑ์</button>
<button id="reset" class="danger" type="button">คืนค่าเริ่มต้น</button>
<div class="muted" style="margin-top:10px">หมายเหตุ: ค่าที่แก้ในหน้านี้เก็บไว้เฉพาะเบราว์เซอร์เครื่องนี้ ยังไม่ใช่การเปลี่ยนเกณฑ์ส่วนกลาง</div>
</section>
</main>

<script>
(()=> {
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
const defaults={home:{name:"Home use",limit:30},dry:{name:"เบเกอรี่แห้ง",limit:15},fresh:{name:"เบเกอรี่สด",limit:2},removeBefore:1};
const docs={home:"home-use-full.pdf",dry:"bakery-dry-full.pdf",fresh:"bakery-dry-full.pdf"};
const $=id=>document.getElementById(id), now=new Date(), pad=n=>String(n).padStart(2,"0");
const todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
let rules=load();
function load(){try{const x=JSON.parse(localStorage.getItem("expCheckerRules")||"null");if(x&&x.home&&x.dry&&x.fresh)return {...defaults,...x}}catch(e){}return JSON.parse(JSON.stringify(defaults))}
function fillAdmin(){$("homeLimit").value=rules.home.limit;$("dryLimit").value=rules.dry.limit;$("freshLimit").value=rules.fresh.limit;$("removeLimit").value=rules.removeBefore}
function validDay(){const max=new Date(Number($("year").value),Number($("month").value),0).getDate();[...$("day").options].forEach(o=>o.disabled=Number(o.value)>max);if(Number($("day").value)>max)$("day").value=max}
function update(){
 validDay();
 $("selected").textContent=`EXP: ${months[Number($("month").value)-1]} ${$("day").value} (${pad(Number($("month").value))}) , ${$("year").value}`;
 const r=rules[$("group").value];
 $("rule").textContent=`เกณฑ์: เหลืออายุน้อยกว่า ${r.limit} วันจึงเริ่มลดราคา 20%`;
 $("ruleNote").textContent=`ต้องนำสินค้าออกก่อน EXP ${rules.removeBefore} วัน — หาก EXP วันที่ 10 วันที่ 9 ยังลดราคาได้ แต่ต้องนำออกช่วงเย็นก่อนปิดร้าน`;
}
for(let i=1;i<=31;i++)$("day").add(new Option(i,i));
months.forEach((m,i)=>$("month").add(new Option(`${m} (${pad(i+1)})`,i+1)));
for(let y=now.getFullYear()-1;y<=now.getFullYear()+15;y++)$("year").add(new Option(y,y));
$("day").value=now.getDate();$("month").value=now.getMonth()+1;$("year").value=now.getFullYear();
$("today").textContent=`Today: ${months[now.getMonth()]} (${pad(now.getMonth()+1)}) ${now.getDate()}, ${now.getFullYear()}`;
function setMode(discount){$("modeDiscount").classList.toggle("active",discount);$("modeExpire").classList.toggle("active",!discount);$("productCard").classList.toggle("hidden",!discount);$("result").hidden=true}
$("modeExpire").onclick=()=>setMode(false);$("modeDiscount").onclick=()=>setMode(true);
[$("day"),$("month"),$("year"),$("group")].forEach(x=>x.addEventListener("change",update));update();
$("docBtn").onclick=()=>{window.open(docs[$("group").value],"_blank")};
$("check").onclick=()=>{
 update();
 const y=+$("year").value,m=+$("month").value,d=+$("day").value,diff=Math.round((Date.UTC(y,m-1,d)-todayUTC)/86400000);
 let icon,title,detail,cls;
 const expDate=new Date(Date.UTC(y,m-1,d));
 const removeDate=new Date(expDate.getTime()-Number(rules.removeBefore)*86400000);
 const removeText=`วันนำออก: ${months[removeDate.getUTCMonth()]} (${pad(removeDate.getUTCMonth()+1)}) ${removeDate.getUTCDate()}, ${removeDate.getUTCFullYear()} ก่อนปิดร้าน`;
 if(!$("modeDiscount").classList.contains("active")){
   if(diff<0){icon="🔴";title="หมดอายุแล้ว";detail=`หมดอายุมาแล้ว ${Math.abs(diff)} วัน`;cls="red";}
   else if(diff===0){icon="🔴";title="หมดอายุวันนี้";detail="ไม่สามารถจำหน่ายได้ / ต้องนำออก";cls="red";}
   else{icon="🟢";title="ยังไม่หมดอายุ";detail=`เหลืออายุ ${diff} วัน`;cls="green";}
 }else{
   const r=rules[$("group").value], start=Number(r.limit), remove=Number(rules.removeBefore);
   if(diff<=0){icon="🔴";title=diff===0?"หมดอายุวันนี้":"หมดอายุแล้ว";detail=diff===0?"ห้ามจำหน่าย / ต้องนำออกแล้ว":`หมดอายุมาแล้ว ${Math.abs(diff)} วัน`;cls="red";}
   else if(diff<=start){icon="🟢";title="สามารถลดราคา 20% ได้";detail=diff===remove?`${removeText} — วันนี้ยังลดราคาได้`: `เหลือ ${diff} วันก่อน EXP — อยู่ในช่วงลดราคา ${start} วันสุดท้าย` + `<br>${removeText}`;cls="green";}
   else{icon="🟡";title="ยังไม่ถึงวันที่ลดราคา";detail=`เหลือ ${diff} วันก่อน EXP — จะเริ่มลดเมื่อเหลือน้อยกว่า ${start} วัน`;cls="yellow";}
 }
 $("result").hidden=false;$("result").className=`result ${cls}`;$("result").innerHTML=`<div class="icon">${icon}</div><div class="status">${title}</div><div class="detail">EXP: <strong>${months[m-1]} (${pad(m)}) ${d}, ${y}</strong><br>${detail}</div>`;
};
$("adminBtn").onclick=()=>{$("admin").classList.toggle("open");fillAdmin()};
$("save").onclick=()=>{rules.home.limit=Math.max(0,+$("homeLimit").value||0);rules.dry.limit=Math.max(0,+$("dryLimit").value||0);rules.fresh.limit=Math.max(0,+$("freshLimit").value||0);rules.removeBefore=Math.max(0,+$("removeLimit").value||0);localStorage.setItem("expCheckerRules",JSON.stringify(rules));update();alert("บันทึกเกณฑ์เรียบร้อยแล้ว")};
$("reset").onclick=()=>{rules=JSON.parse(JSON.stringify(defaults));localStorage.setItem("expCheckerRules",JSON.stringify(rules));fillAdmin();update();alert("คืนค่าเริ่มต้นแล้ว")};
fillAdmin();
})();
</script>
</body>
</html>
